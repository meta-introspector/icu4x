#[workspace]
resolver = "2"
members = [
    # KEEP IN SYNC WITH workspace.dependencies and examples/.cargo/config.toml

    # ICU4X core
    "components/locale_core",
    "provider/core",

    # Components
    "components/calendar",
    "components/casemap",
    "components/collator",
    "components/collections",
    "components/collections/codepointtrie_builder",
    "components/datetime",
    "components/decimal",
    "components/experimental",
    "components/icu",
    "components/list",
    "components/locale",
    "components/normalizer",
    "components/pattern",
    "components/plurals",
    "components/properties",
    "components/segmenter",
    "components/time",

    # FFI
    "ffi/capi",
    "ffi/ecma402",
    "ffi/freertos",

    # Provider
    "provider/adapters",
    "provider/baked",
    "provider/source",
    "provider/blob",
    "provider/export",
    "provider/fs",
    "provider/registry",
    "provider/icu4x-datagen",

    # Baked data
    "provider/data/calendar",
    "provider/data/casemap",
    "provider/data/collator",
    "provider/data/datetime",
    "provider/data/decimal",
    "provider/data/list",
    "provider/data/locale",
    "provider/data/normalizer",
    "provider/data/plurals",
    "provider/data/properties",
    "provider/data/segmenter",
    "provider/data/time",

    # Utils
    "utils/bies",
    "utils/calendrical_calculations",
    "utils/crlify",
    "utils/databake",
    "utils/databake/derive",
    "utils/fixed_decimal",
    "utils/ixdtf",
    "utils/litemap",
    "utils/resb",
    "utils/tinystr",
    "utils/tzif",
    "utils/potential_utf",
    "utils/writeable",
    "utils/yoke",
    "utils/yoke/derive",
    "utils/zerofrom",
    "utils/zerofrom/derive",
    "utils/zerotrie",
    "utils/zerovec",
    "utils/zerovec/derive",
    "utils/zoneinfo64",

    # Tools
    "tools/benchmark/binsize",
    "tools/benchmark/macros",
    "tools/benchmark/memory",
    "tools/make/bakeddata",
    "tools/make/codegen",
    "tools/make/depcheck",
    "tools/make/diplomat-coverage",
    "tools/make/diplomat-gen",
    "tools/make/download-repo-sources",
    "tools/md-tests",
    "tools/noalloctest",
]
# Note: Workspaces in subdirectories, such as components/collator/fuzz, are
# implicitly excluded from the main workspace.
exclude = [
    # host_info requires a custom ci job to avoid having to pull its optional dependencies
    "utils/host_info",
    # Examples are tested outside the workspace to simulate external users
    "examples",
    # Don't publish the graveyard
    "tools/graveyard"
]

[workspace.package]
version = "2.1.1"
# rust-version = "1.83"
authors = ["The ICU4X Project Developers"]
edition = "2021"
repository = "https://github.com/unicode-org/icu4x"
homepage = "https://icu4x.unicode.org"
license = "Unicode-3.0"
categories = ["internationalization"]
include = [
    "data/**/*",
    "src/**/*",
    "examples/**/*",
    "benches/**/*",
    "tests/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "build.rs",
]

[workspace.dependencies]
# KEEP IN SYNC WITH workspace.members and examples/.cargo/config.toml

# ICU4X core
# These use non-tilde deps, see https://github.com/unicode-org/icu4x/issues/4343
icu_locale_core = { version = "2.1.1", path = "components/locale_core" }
icu_provider = { version = "2.1.1", path = "provider/core" }
icu_pattern = { version = "0.4.1", path = "components/pattern" }

# Components
icu = { version = "~2.1.1", path = "components/icu" }
icu_calendar = { version = "~2.1.1", path = "components/calendar" }
icu_casemap = { version = "~2.1.1", path = "components/casemap" }
icu_collator = { version = "~2.1.1", path = "components/collator" }
icu_collections = { version = "~2.1.1", path = "components/collections" }
icu_codepointtrie_builder = { version = "~0.5.0", path = "components/collections/codepointtrie_builder" }
icu_datetime = { version = "~2.1.1", path = "components/datetime" }
icu_decimal = { version = "~2.1.1", path = "components/decimal" }
icu_experimental = { version = "~0.4.0", path = "components/experimental" }
icu_list = { version = "~2.1.1", path = "components/list" }
icu_locale = { version = "~2.1.1", path = "components/locale" }
icu_normalizer = { version = "~2.1.1", path = "components/normalizer" }
icu_plurals = { version = "~2.1.1", path = "components/plurals" }
icu_properties = { version = "~2.1.1", path = "components/properties" }
icu_segmenter = { version = "~2.1.1", path = "components/segmenter" }
icu_time = { version = "~2.1.1", path = "components/time" }

# FFI
icu_capi = { version = "~2.1.1", path = "ffi/capi" }
# icu4x_ecma402 never used as a dep
# icu_freertos never used as a dep

# Provider
icu_provider_export = { version = "~2.1.1", path = "provider/export" }
icu_provider_source = { version = "~2.1.1", path = "provider/source" }
icu_provider_adapters = { version = "~2.1.1", path = "provider/adapters" }
icu_provider_baked = { version = "~2.1.1", path = "provider/baked" }
icu_provider_blob = { version = "~2.1.1", path = "provider/blob" }
icu_provider_fs = { version = "~2.1.1", path = "provider/fs" }
icu_provider_registry = { version = "~2.1.1", path = "provider/registry" }

# Baked data
icu_calendar_data = { version = "~2.1.1", path = "provider/data/calendar" }
icu_casemap_data = { version = "~2.1.1", path = "provider/data/casemap" }
icu_collator_data = { version = "~2.1.1", path = "provider/data/collator" }
icu_datetime_data = { version = "~2.1.1", path = "provider/data/datetime" }
icu_decimal_data = { version = "~2.1.1", path = "provider/data/decimal" }
icu_list_data = { version = "~2.1.1", path = "provider/data/list" }
icu_locale_data = { version = "~2.1.1", path = "provider/data/locale" }
icu_normalizer_data = { version = "~2.1.1", path = "provider/data/normalizer" }
icu_plurals_data = { version = "~2.1.1", path = "provider/data/plurals" }
icu_properties_data = { version = "~2.1.1", path = "provider/data/properties" }
icu_segmenter_data = { version = "~2.1.1", path = "provider/data/segmenter" }
icu_time_data = { version = "~2.1.1", path = "provider/data/time" }
icu_experimental_data = { version = "~0.4.0", path = "provider/data/experimental" }

# Utils
bies = { version = "0.2.2", path = "utils/bies" }
calendrical_calculations = { version = "0.2.3", path = "utils/calendrical_calculations" }
crlify = { version = "1.0.4", path = "utils/crlify" }
databake = { version = "0.2.0", path = "utils/databake" }
databake-derive = { version = "0.2.0", path = "utils/databake/derive" }
fixed_decimal = { version = "0.7.0", path = "utils/fixed_decimal" }
ixdtf = { version = "0.6.0", path = "utils/ixdtf" }
litemap = { version = "0.8.0", path = "utils/litemap" }
potential_utf = { version = "0.1.3", path = "utils/potential_utf" }
resb = { version = "0.1.0", path = "utils/resb" }
tzif = { version = "0.4.0", path = "utils/tzif" }
tinystr = { version = "0.8.0", path = "utils/tinystr" }
writeable = { version = "0.6.0", path = "utils/writeable" }
yoke = { version = "0.8.0", path = "utils/yoke" }
yoke-derive = { version = "0.8.0", path = "utils/yoke/derive" }
zerofrom = { version = "0.1.3", path = "utils/zerofrom" }
zerofrom-derive = { version = "0.1.3", path = "utils/zerofrom/derive" }
zerotrie = { version = "0.2.0", path = "utils/zerotrie" }
zerovec = { version = "0.11.3", path = "utils/zerovec" }
zerovec-derive = { version = "0.11.1", path = "utils/zerovec/derive" }
zoneinfo64 = { version = "0.2.0", path = "utils/zoneinfo64" }

# Tools
icu_benchmark_macros = { path = "tools/benchmark/macros" }
# bench-binsize never used as a dep
# bench-memory never used as a dep
# make/* never used as a dep

# The version here can either be a `version = ".."` spec or `git = "https://github.com/rust-diplomat/diplomat", rev = ".."`
# Diplomat must be published preceding a new ICU4X release but may use git versions in between
diplomat = { version = "0.14.0" }
diplomat-runtime = { version = "0.14.0" }
diplomat_core = { version = "0.14.0" }
diplomat-tool = { version = "0.14.1" }

# EXTERNAL DEPENDENCIES
#
# Due to semver-related constraints, we generally want to consume crates.io dependencies with
# default features, with some notable exceptions:
#
# 1. Dependencies of core library crates need to be `no_std`
# 2. Some crates have a lot of default features that pull in undesirable transitive deps
#
# We therefore have three groups for our crates.io dependencies.

## External Deps Group 1: Library deps except datagen. No default features.
# Keep in sync with allowlist.rs:
# BASIC_RUNTIME_DEPS
# BASIC_BUILD_DEPS
# EXTRA_SERDE_DEPS
# EXTRA_EXPERIMENTAL_DEPS
# EXTRA_LSTM_DEPS
# EXTRA_RYU_DEPS
# EXTRA_CAPI_DEPS
# EXTRA_BLOB_DEPS
# EXTRA_FS_DEPS
arrayvec = { version = "0.7.2" }
core_maths = { version = "0.1.0" }
displaydoc = { version = "0.2.3" }
either = { version = "1.9.0" }
harfbuzz-traits = { version = "0.6.0" }
libc_alloc = { version = "1.0.6" }
log = { version = "0.4.17" }
memchr = { version = "2.6.0" }
num-bigint = { version = "0.4.3" }
num-rational = { version = "0.4.0" }
num-traits = { version = "0.2.0" }
postcard = { version = "1.0.3" }
regex-automata = { version = "0.4.7" }
ryu = { version = "1.0.5" }
schemars = { version = "1.0.4" }
serde = { version = "1.0.220" }
serde_core = { version = "1.0.220" }
serde-json-core = { version = "0.6.0" }
//smallvec = { version = "1.10.0" }
smallvec = {workspace=true}
stable_deref_trait = { version = "1.2.0" }
twox-hash = { version = "2.0.0", features = ["xxhash64"] }
unicode-bidi = { version = "0.3.11" }
utf16_iter = { version = "1.0.2" }
utf8_iter = { version = "1.0.2" }
write16 = { version = "1.0.0" }

## External Deps Group 2: Heavy Dev and Datagen deps. No default features.
zip = { workspace = true }
tar = { version = "0.4.43" }
flate2 = { version = "1.0.35" }
serde-aux = { version = "4.0.0" }
toml = { version = "0.8.0", features = ["parse"] }

## External Deps Group 3: Dev and Datagen deps. Include default features.
arraystring = "0.3.0"
askama = "0.14"
atoi = "2.0.0"
bincode = "1.3.1" # Can be updated to 2.0 after MSRV 1.85
clap = "4.2.0"
combine = "4.3.1"
criterion = "0.5.0"
detone = "1.0.0"
elsa = "1.10.0"
erased-serde = "0.4.0"
eyre = "0.6.0"
getrandom = "0.3"
heck = "0.5"
iai = "0.1.1"
indexmap = "2.0.0"
insta = "1.43.2"
itertools = "0.14.0"
ndarray = "0.16.0"
parse-zoneinfo =  "0.5.0"
proc-macro2 = "1.0.61"
quote = "1.0.28"
rand = "0.9"
rand_distr = "0.5"
rand_pcg = "0.9"
rayon = "1.3.0"
rkyv = "0.7"
rmp-serde = "1.2.0"
serde_json = "1.0.45"
simple_logger = "5.0.0"
syn = "2.0.21"
synstructure = "0.13.0"
ureq = "3.0.0"
walkdir = "2.3.2"
wasmi = "0.40.0"
wat = "1"

# Size optimized builds
# [profile.release-opt-size]
# inherits = "release"
# lto = true
# opt-level = "s"
# panic = "abort"
# codegen-units = 1

# # Builds with debug metadata but not debug assertions
# # for testing GIGO code paths
# [profile.dev-without-assertions]
# inherits = "dev"
# debug-assertions = false

# # For slow tests
# [profile.release-with-assertions]
# inherits = "release"
# debug-assertions = true

# [profile.bench]
# lto = true

# # Enable debug information specifically for memory profiling.
# # https://docs.rs/dhat/0.2.1/dhat/#configuration
# [profile.bench-memory]
# inherits = "bench"
# debug = true

[workspace.metadata.cargo-semver-checks.lints]
type_method_marked_deprecated.level = "allow" # allow deprecation in patch releases
trait_method_marked_deprecated.level = "allow" # allow deprecation in patch releases
type_marked_deprecated.level = "allow" # allow deprecation in patch releases
struct_field_marked_deprecated = "allow" # allow deprecation in patch releases
enum_no_repr_variant_discriminant_changed = "allow" # we don't consider this breaking https://github.com/obi1kenobi/cargo-semver-checks/issues/1376
